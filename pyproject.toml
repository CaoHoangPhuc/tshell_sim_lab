[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tshell-sim-lab"
version = "0.1.0"
description = "Tessent Shell Mock Environment & DFT Scan Chain Simulation Lab"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "EDA Lab Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pymupdf>=1.23.0",
]

[project.scripts]
tshell = "tshell:main"
tshell-exercises = "exercises:main"
tshell-insertion = "insertion:main"
tshell-scan-sim = "scan_sim:main"

[tool.setuptools]
py-modules = ["tshell", "exercises", "insertion", "scan_sim"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tessent_core*", "rtl*"]

[tool.setuptools.package-data]
tessent_core = ["*.json"]
rtl = ["*.v", "*.vh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
